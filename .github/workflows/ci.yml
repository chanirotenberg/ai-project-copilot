name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: projectcopilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d projectcopilot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5433;Database=projectcopilot;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./ProjectCopilot.slnx

      - name: Build
        run: dotnet build ./ProjectCopilot.slnx --no-restore --configuration Release

      - name: Apply migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.4
          dotnet ef database update \
            --project ./src/ProjectCopilot.Infrastructure/ProjectCopilot.Infrastructure.csproj \
            --startup-project ./src/ProjectCopilot.Api/ProjectCopilot.Api.csproj

      - name: Test
        run: dotnet test ./ProjectCopilot.slnx --no-build --configuration Release